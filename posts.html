<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-brand-group">
            <h1>RRom</h1>
            <a href="index.html" class="home-link">Home</a>
        </div>

        <div class="header-right-group">
            <div class="nav-dropdown">
                <button class="dropdown-trigger">Menu ▾</button>
                <div id="mainNav" class="dropdown-content">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="profile.html">Profile</a>
                    <a href="posts.html">Forum</a>
                </div>
            </div>

            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="forum-layout">

        <!-- LEFT SIDEBAR: LIKES LEADERBOARD -->
        <aside class="leaderboard-sidebar">
            <div class="leaderboard">
                <h2>Most Likes</h2>
                <div id="likesLeaderboard">
                    Loading...
                </div>
            </div>
        </aside>

        <!-- CENTER COLUMN: CREATE POST & FEED -->
        <section class="forum-main-content">

            <section class="posts-title">
                <h2>All Posts</h2>
                <p>See what everyone is posting.</p>
            </section>

            <!-- CREATE POST FORM -->
            <section class="dashboard-section create-post-box">
                <h2>Create a Post</h2>
                <form id="postForm">
                    <textarea
                        id="postContent"
                        placeholder="What's on your mind?"
                        rows="4"
                        required
                    ></textarea>
                    <button type="submit">Post</button>
                </form>
                <p id="postMessage"></p>
            </section>

            <!-- POSTS FEED -->
            <section class="all-posts">
                <h2>Latest Posts</h2>
                <div id="postsContainer">
                    Loading posts...
                </div>
            </section>

        </section>

        <!-- RIGHT SIDEBAR: POSTS LEADERBOARD -->
        <aside class="leaderboard-sidebar">
            <div class="leaderboard">
                <h2>📝 Most Posts</h2>
                <div id="postsLeaderboard">
                    Loading...
                </div>
            </div>
        </aside>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script src="posts.js"></script>

</body>
</html>
